---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: tokoro-os
description: Tokoro OS — JDM-themed, adaptive gaming distro

base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: script
    snippets:
      - sed -i 's/^NAME=.*/NAME="Tokoro OS"/' /usr/lib/os-release
      - sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="Tokoro OS"/' /usr/lib/os-release
      - sed -i 's/^# Welcome to Bazzite.*/# Welcome to Tokoro OS/' /usr/share/ublue-os/motd/template.md
      - sed -i '/bazzite\.gg/d' /usr/share/ublue-os/motd/template.md

  - type: signing
